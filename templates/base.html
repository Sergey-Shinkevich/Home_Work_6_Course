<!DOCTYPE html>
<html lang="ru">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Боковое меню -->
            <nav class="col-2 bg-dark text-white min-vh-100 d-flex flex-column p-3">
                <h4>Меню</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/categories">Категории</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/orders">Заказы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/contacts">Контакты</a>
                    </li>
                </ul>

                <!-- Блок внизу -->
                <div class="mt-auto">
                    <hr>
                    <!-- Выпадающее меню -->
                    <div class="dropdown mt-2">
                    <a href="#" class="text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        Пользователь
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                        <li><a class="dropdown-item" href="#">Профиль</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" href="#">Выход</a></li>
                    </ul>
                </div>
                </div>
            </nav>

            <!-- Основной контент -->
            <main class="col-10">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
